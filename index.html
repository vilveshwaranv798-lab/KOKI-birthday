<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday KOKI ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div id="background">
        <div id="stars"></div>
        <div id="shooting-stars"></div>
        <div id="overlay"></div>
    </div>

    <!-- Intro Screen -->
    <section id="intro">

        <div class="intro-content">

            <p class="intro-top">
                A Small Surprise For Someone Special ✨
            </p>

            <h1 class="main-title">
                Happy Birthday
            </h1>

            <h2 class="name">
                KOKI ❤️
            </h2>

            <p class="intro-text">
                Today isn't just another day...<br>
                It's the day someone truly special came into this world.🌸
            </p>

            <button id="startBtn">
                Open Surprise 🎁
            </button>

        </div>

    </section>

    <!-- Photo Scene -->
    <section id="photoScene">

        <div class="photo-frame">
            <img id="mainPhoto" src="assets/photos/1.jpg" alt="KOKI">
        </div>

    </section>

    <!-- Letter Scene -->
    <section id="letterScene">

        <div class="letter">

            <h2>💌 A Special Message</h2>

            <p id="letterText">
                <!-- JavaScript la message type aagum -->
            </p>

        </div>

    </section>

    <!-- Ending -->
    <section id="endingScene">

        <h1>🎂 Happy Birthday KOKI ❤️</h1>

        <p>
            Stay Happy...<br>
            Stay Blessed...<br>
            Keep Smiling Always 😊🤞
        </p>

        <button id="replayBtn">Replay 🔁</button>

        <div class="credit">
            Made with ❤️ by your Azhagu Pulla 😉
        </div>

    </section>

    <audio id="bgMusic" src="assets/music/song.mp3"></audio>

    <script src="script.js"></script>

</body>
</html>
